<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0912" />
    <meta
      name="description"
      content="Munshot Content System — investor-grade intelligence, published across LinkedIn, email and long-form."
    />
    <!-- Display + body: Satoshi (Fontshare) -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=clash-display@600,700&display=swap"
      rel="stylesheet"
    />
    <!-- Micro-labels: JetBrains Mono (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Munshot · Content System</title>
    <!-- No-flash theme init: set data-theme before first paint -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('munshot-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#FFFECB' : '#170F12');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
