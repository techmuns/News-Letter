name: Deploy to Cloudflare Pages

# Configure once (see README), then every push to main deploys automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

# No step in this workflow calls an LLM, so BEDROCK_API_KEY is deliberately not
# wired into it — the build and the Cloudflare deploy have no use for it, and a
# bad LLM key must not be able to block a static deploy. When an LLM-calling
# step is added here, gate it on the preflight and pass the secret through:
#
#   jobs:
#     preflight:
#       uses: ./.github/workflows/llm-preflight.yml
#       secrets: inherit
#     deploy:
#       needs: preflight
#       steps:
#         - name: <the step that calls the LLM>
#           env:
#             BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
#             BEDROCK_REGION: us-east-1
#             OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # wrangler.toml supplies compatibility_flags = ["nodejs_compat"], which the
      # Pages Function in functions/ needs to load at all.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=munshot-content-system --branch=main

      # Free, no model call: confirms the Cloudflare secret is actually bound to
      # the deployed Function. Informational — a missing LLM binding must not
      # fail a static site deploy.
      - name: Check LLM bindings on the deployment
        continue-on-error: true
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          if [ -z "$URL" ]; then
            echo "::notice::No deployment URL returned; skipping binding check."
            exit 0
          fi
          echo "Checking $URL/api/llm-health"
          BODY=$(curl -fsS --max-time 30 "$URL/api/llm-health" || echo '{}')
          echo "$BODY"
          if echo "$BODY" | grep -q '"BEDROCK_API_KEY": true'; then
            echo "::notice::BEDROCK_API_KEY is bound to the deployed Function."
          else
            echo "::warning::BEDROCK_API_KEY is NOT bound. Set it in Cloudflare -> \
          Workers & Pages -> munshot-content-system -> Settings -> Variables and Secrets."
          fi
